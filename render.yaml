# Render Blueprint for Medware HR (Frappe + ERPNext + HRMS).
# Lives at the repository root; the Docker build context is the hrms-develop/ folder.
# See hrms-develop/docs/PRODUCTION_RENDER.md for the step-by-step runbook.
#
# Region: frankfurt is the closest Render region with good latency to Kenya (Render has no African region).

services:
  # --- the app: nginx + gunicorn + socket.io + scheduler + worker in one container ---------------
  - type: web
    name: medware-hr
    runtime: docker
    region: frankfurt
    plan: standard # Frappe needs about 2 GB RAM; do not go below this
    dockerfilePath: ./hrms-develop/docker/production/Dockerfile
    dockerContext: ./hrms-develop
    healthCheckPath: /api/method/ping
    disk:
      name: sites
      mountPath: /home/frappe/frappe-bench/sites
      sizeGB: 20
    envVars:
      - key: SITE_NAME
        sync: false # enter your subdomain, e.g. hr.yourdomain.co.ke
      - key: ADMIN_PASSWORD
        sync: false # choose a strong password; only used when the site is first created
      - key: DB_HOST
        fromService:
          type: pserv
          name: medware-hr-db
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_ROOT_PASSWORD
        fromService:
          type: pserv
          name: medware-hr-db
          envVarKey: MARIADB_ROOT_PASSWORD
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: medware-hr-redis
          property: connectionString
      - key: GUNICORN_WORKERS
        value: "2"

  # --- MariaDB (Render has no managed MariaDB, so it runs as a private service) -------------------
  - type: pserv
    name: medware-hr-db
    runtime: image
    region: frankfurt
    plan: standard
    image:
      url: docker.io/library/mariadb:11.8
    # The data directory is a subfolder because a fresh Render disk contains a lost+found folder,
    # which MariaDB refuses to initialise into.
    dockerCommand: >-
      mariadbd --datadir=/var/lib/mysql/data
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake
    disk:
      name: db
      mountPath: /var/lib/mysql
      sizeGB: 20
    envVars:
      - key: MARIADB_ROOT_PASSWORD
        generateValue: true
      - key: MARIADB_ROOT_HOST
        value: "%"

  # --- Redis (cache, background-job queue, realtime) ----------------------------------------------
  - type: keyvalue
    name: medware-hr-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction # the job queue must never lose entries
    ipAllowList: [] # private network only
