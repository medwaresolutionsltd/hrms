# nginx in front of gunicorn (Frappe) and socket.io, inside the single production container.
# Render terminates HTTPS at its edge and forwards plain HTTP to $PORT with X-Forwarded-Proto.
# The entrypoint renders ${PORT} and ${SITE_NAME} into /tmp/nginx.conf.

pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 2;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /dev/stdout;
	sendfile on;
	keepalive_timeout 65;
	client_max_body_size 50m;

	# nginx runs as the unprivileged frappe user: keep every temp path writable.
	client_body_temp_path /tmp/nginx-body;
	proxy_temp_path /tmp/nginx-proxy;
	fastcgi_temp_path /tmp/nginx-fastcgi;
	uwsgi_temp_path /tmp/nginx-uwsgi;
	scgi_temp_path /tmp/nginx-scgi;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	# Keep the original scheme from Render's proxy so Frappe builds https:// links.
	map $http_x_forwarded_proto $forwarded_proto {
		default $http_x_forwarded_proto;
		'' $scheme;
	}

	upstream backend {
		server 127.0.0.1:8000 fail_timeout=0;
	}

	upstream socketio {
		server 127.0.0.1:9000 fail_timeout=0;
	}

	server {
		listen ${PORT};
		server_name _;
		root /home/frappe/frappe-bench/sites;

		# Static assets: hashed file names, so cache for a year.
		location /assets {
			try_files $uri =404;
			add_header Cache-Control "max-age=31536000";
		}

		# Private files are served by nginx only after Frappe authorises them (X-Accel-Redirect).
		location ~ ^/protected/(.*) {
			internal;
			try_files /${SITE_NAME}/$1 =404;
		}

		location /socket.io {
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header X-Frappe-Site-Name ${SITE_NAME};
			proxy_set_header Origin $scheme://$http_host;
			proxy_set_header Host $host;
			proxy_pass http://socketio;
		}

		location / {
			rewrite ^(.+)/$ $1 permanent;
			rewrite ^(.+)\.html$ $1 permanent;

			proxy_set_header X-Frappe-Site-Name ${SITE_NAME};
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $forwarded_proto;
			proxy_set_header X-Use-X-Accel-Redirect True;
			proxy_read_timeout 120;
			proxy_redirect off;
			proxy_pass http://backend;
		}
	}
}
